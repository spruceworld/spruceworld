from PIL import Image, ImageDraw, ImageFont, ImageFilter
from pathlib import Path
import math, random, os

W,H=1200,420
random.seed(23)
stars=[(random.randint(15,W-15),random.randint(12,H-12),random.choice([1,1,1,2]),random.random()*math.tau,random.uniform(.7,1.7)) for _ in range(85)]
font_path="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
if not Path(font_path).exists():
    font_path="/usr/share/fonts/truetype/liberation2/LiberationSans-Regular.ttf"
qfont=ImageFont.truetype(font_path,27)
afont=ImageFont.truetype(font_path,16)
tfont=ImageFont.truetype(font_path,12)
lines=[
"“Twenty years from now you will be more disappointed",
"by the things that you didn't do than by the ones you",
"did do. So throw off the bowlines. Sail away from the",
"safe harbor. Catch the trade winds in your sails.”"
]
frames=[]
N=32

def draw_center(draw, y, text, font, fill):
    box=draw.textbbox((0,0),text,font=font)
    x=(W-(box[2]-box[0]))/2
    draw.text((x,y),text,font=font,fill=fill)

for i in range(N):
    t=i/N
    im=Image.new("RGBA",(W,H),(0,0,0,255))
    # Very subtle neutral charcoal haze, with no blue hue.
    haze=Image.new("RGBA",(W,H),(0,0,0,0))
    hd=ImageDraw.Draw(haze)
    hd.ellipse((230,30,970,390),fill=(25,24,27,18))
    haze=haze.filter(ImageFilter.GaussianBlur(90))
    im.alpha_composite(haze)
    d=ImageDraw.Draw(im)
    for x,y,r,phase,speed in stars:
        v=(math.sin(t*math.tau*speed+phase)+1)/2
        alpha=int(25+215*(v**2))
        rad=r if alpha<180 else r+0.25
        d.ellipse((x-rad,y-rad,x+rad,y+rad),fill=(255,255,255,alpha))
    fade=0.72+0.28*(0.5-0.5*math.cos(t*math.tau))
    a=int(255*fade)
    # Build a soft, low-opacity glow on a separate layer.
    glow=Image.new("RGBA",(W,H),(0,0,0,0))
    gd=ImageDraw.Draw(glow)
    for idx,line in enumerate(lines):
        box=gd.textbbox((0,0),line,font=qfont)
        x=(W-(box[2]-box[0]))/2
        gd.text((x,103+idx*43),line,font=qfont,fill=(255,255,255,int(40*fade)))
    glow=glow.filter(ImageFilter.GaussianBlur(3))
    im.alpha_composite(glow)
    d=ImageDraw.Draw(im)
    for idx,line in enumerate(lines):
        draw_center(d,103+idx*43,line,qfont,(244,244,246,a))
    draw_center(d,299,"— Unknown",afont,(165,165,174,a))
    draw_center(d,358,"EXPLORE  ·  DREAM  ·  DISCOVER",tfont,(115,115,124,a))
    frames.append(im.convert("RGB").quantize(colors=128, method=Image.Quantize.MEDIANCUT))

out=Path("/mnt/data/space_quote_github.gif")
frames[0].save(out,save_all=True,append_images=frames[1:],duration=100,loop=0,optimize=True,disposal=2)
print(out, out.stat().st_size)
