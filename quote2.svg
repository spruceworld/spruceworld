<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <defs>
    <!-- Import Minecraft-style Pixel Font -->
    <style>
      display=swap');

      /* Pure Jet Black Background */
      .bg {
        fill: #000000;
      }
      
      /* Minecraft Text Styling */
      .text-base {
        font-family: 'Press Start 2P', monospace;
        font-size: 11px;
        text-anchor: middle;
        fill: #e0f2fe;
      }

      /* Strong Cyan Backlit Glow */
      .glowing-text {
        filter: drop-shadow(0 0 3px #00e5ff) 
                drop-shadow(0 0 8px #00b0ff) 
                drop-shadow(0 0 16px rgba(0, 176, 255, 0.6));
      }

      .author {
        fill: #38bdf8;
        font-size: 10px;
      }

      /* Twinkling star animation */
      @keyframes twinkle {
        0%, 100% { opacity: 0.15; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
      }

      .star {
        animation: twinkle var(--duration, 3s) infinite ease-in-out;
        animation-delay: var(--delay, 0s);
        fill: #ffffff;
      }

      /* Slow Fade-In Animation for Text */
      @keyframes slowFadeIn {
        0% {
          opacity: 0;
          transform: translateY(6px);
        }
        100% {
          opacity: 1;
          transform: translateY(0px);
        }
      }

      .fade-in-text {
        animation: slowFadeIn 3.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>

    <!-- Star Symbols -->
    <circle id="star-dot" cx="0" cy="0" r="1.2" />
    <path id="star-cross" d="M0,-3.5 L0,3.5 M-3.5,0 L3.5,0" stroke="#ffffff" stroke-width="0.6" opacity="0.8" />
  </defs>

  <!-- Pure Jet Black Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Twinkling Stars Field -->
  <g>
    <use href="#star-dot" class="star" style="--duration: 2.2s; --delay: 0.1s;" />
    <use href="#star-cross" class="star" style="--duration: 4.1s; --delay: 0.8s;" transform="scale(0.8)" />
    <use href="#star-dot" class="star" style="--duration: 3.0s; --delay: 0.4s;" />
    <use href="#star-dot" class="star" style="--duration: 2.5s; --delay: 1.2s;" />
    <use href="#star-cross" class="star" style="--duration: 4.8s; --delay: 0.5s;" />
    <use href="#star-dot" class="star" style="--duration: 2.8s; --delay: 1.8s;" />
    <use href="#star-dot" class="star" style="--duration: 3.4s; --delay: 0.2s;" />
    <use href="#star-cross" class="star" style="--duration: 4.2s; --delay: 1.0s;" />
    <use href="#star-dot" class="star" style="--duration: 2.9s; --delay: 0.6s;" />

    <use href="#star-dot" class="star" style="--duration: 3.6s; --delay: 1.5s;" />
    <use href="#star-cross" class="star" style="--duration: 2.6s; --delay: 0.3s;" transform="scale(0.7)" />
    <use href="#star-dot" class="star" style="--duration: 4.0s; --delay: 0.9s;" />
    <use href="#star-cross" class="star" style="--duration: 3.3s; --delay: 0.7s;" />

    <use href="#star-dot" class="star" style="--duration: 2.7s; --delay: 0.4s;" />
    <use href="#star-dot" class="star" style="--duration: 4.4s; --delay: 1.3s;" />
    <use href="#star-cross" class="star" style="--duration: 3.1s; --delay: 0.1s;" transform="scale(0.8)" />
    <use href="#star-dot" class="star" style="--duration: 2.3s; --delay: 1.7s;" />
    <use href="#star-dot" class="star" style="--duration: 3.8s; --delay: 0.6s;" />
    <use href="#star-cross" class="star" style="--duration: 4.0s; --delay: 1.1s;" />
    <use href="#star-dot" class="star" style="--duration: 2.9s; --delay: 0.8s;" />
  </g>

  <!-- Animated Text Content -->
  <g class="fade-in-text">
    <text x="50%" y="85" class="text-base glowing-text">
      <tspan class="line text" x="50%" dy="0">"Twenty years from now you will be more disappointed</tspan>
      <tspan class="line text" x="50%" dy="2.1em">by the things that you didn't do than by the ones you</tspan>
      <tspan class="line text" x="50%" dy="2.1em">did do. So throw off the bowlines. Sail away from the</tspan>
      <tspan class="line text" x="50%" dy="2.1em">safe harbor. Catch the trade winds in your sails.</tspan>
      <tspan class="line text" x="50%" dy="2.1em">Explore. Dream. Discover." <tspan class="author">— Unknown</tspan></tspan>
    </text>
  </g>
</svg>
