<svg width="800" height="260" viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .text {
        font-family: 'Georgia', serif;
        font-size: 21px;
        fill: #ffffff;
        font-style: italic;
        letter-spacing: 0.5px;
      }
      .author {
        font-family: 'Georgia', serif;
        font-size: 18px;
        fill: #ffffff;
        font-style: normal;
        font-weight: bold;
        letter-spacing: 2px;
      }
      
      /* Staggered, smooth fade-in */
      .line {
        opacity: 0;
        animation: fadeIn 5s ease-in-out forwards;
      }
      .line:nth-child(1) { animation-delay: 1.5s; }
      .line:nth-child(2) { animation-delay: 2.5s; }
      .line:nth-child(3) { animation-delay: 3.5s; }
      .line:nth-child(4) { animation-delay: 4.5s; }
      .line:nth-child(5) { animation-delay: 5.5s; }
      
      @keyframes fadeIn {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }
    </style>
    
    <!-- Clean, sharp white glow effect -->
    <filter id="whiteGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Apply the glow to the whole text block -->
  <g filter="url(#whiteGlow)">
    <text x="50%" y="20%" text-anchor="middle">
      <tspan class="line text" x="50%" dy="0">"Twenty years from now you will be more disappointed</tspan>
      <tspan class="line text" x="50%" dy="1.8em">by the things that you didn't do than by the ones you</tspan>
      <tspan class="line text" x="50%" dy="1.8em">did do. So throw off the bowlines. Sail away from the</tspan>
      <tspan class="line text" x="50%" dy="1.8em">safe harbor. Catch the trade winds in your sails.</tspan>
      <tspan class="line text" x="50%" dy="1.8em">Explore. Dream. Discover." <tspan class="author">— Unknown</tspan></tspan>
    </text>
  </g>
</svg>
