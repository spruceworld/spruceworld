from PIL import Image, ImageDraw, ImageFont, ImageFilter
import math, random
from pathlib import Path

W, H = 1200, 420
out = Path("/mnt/data/space_quote_github.gif")
random.seed(22)

# Fixed sparse star field: x, y, radius, phase, speed
stars = []
for _ in range(75):
    x = random.randint(18, W-18)
    y = random.randint(16, H-16)
    r = random.choice([1, 1, 1, 2])
    phase = random.random() * math.tau
    speed = random.uniform(0.7, 1.6)
    stars.append((x, y, r, phase, speed))

font_paths = [
    "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",
    "/usr/share/fonts/truetype/liberation2/LiberationSans-Regular.ttf",
]
font_path = next((p for p in font_paths if Path(p).exists()), None)
if font_path:
    quote_font = ImageFont.truetype(font_path, 27)
    attr_font = ImageFont.truetype(font_path, 16)
    tagline_font = ImageFont.truetype(font_path, 12)
else:
    quote_font = ImageFont.load_default()
    attr_font = ImageFont.load_default()
    tagline_font = ImageFont.load_default()

lines = [
    "“Twenty years from now you will be more disappointed",
    "by the things that you didn't do than by the ones you",
    "did do. So throw off the bowlines. Sail away from the",
    "safe harbor. Catch the trade winds in your sails.”",
]

def centered_text(draw, y, text, font, fill, glow_alpha=0):
    bbox = draw.textbbox((0, 0), text, font=font)
    x = (W - (bbox[2] - bbox[0])) / 2
    if glow_alpha:
        # Draw a soft, restrained white glow behind the letters.
        glow = Image.new("RGBA", (W, H), (0, 0, 0, 0))
        gd = ImageDraw.Draw(glow)
        gd.text((x, y), text, font=font, fill=(255, 255, 255, glow_alpha), stroke_width=0)
        glow = glow.filter(ImageFilter.GaussianBlur(3))
        canvas.alpha_composite(glow)
    draw.text((x, y), text, font=font, fill=fill)

frames = []
nframes = 32
for frame_i in range(nframes):
    t = frame_i / nframes
    # Nearly pure black background, with a barely visible neutral charcoal center.
    base = Image.new("RGB", (W, H), (0, 0, 0))
    # Extremely subtle charcoal atmospheric glow, not blue.
    haze = Image.new("RGBA", (W, H), (0, 0, 0, 0))
    hd = ImageDraw.Draw(haze)
    hd.ellipse((220, 30, 980, 390), fill=(28, 26, 31, 22))
    haze = haze.filter(ImageFilter.GaussianBlur(95))
    canvas = base.convert("RGBA")
    canvas.alpha_composite(haze)
    d = ImageDraw.Draw(canvas)

    # Twinkle brightness cycles at different speeds.
    for x, y, r, phase, speed in stars:
        v = (math.sin(t * math.tau * speed + phase) + 1) / 2
        alpha = int(40 + 190 * (v ** 2))
        rr = r if alpha < 180 else r + 0.3
        d.ellipse((x-rr, y-rr, x+rr, y+rr), fill=(255, 255, 255, alpha))

    # Slow opacity fade between a calm dim state and bright state.
    fade = 0.72 + 0.28 * (0.5 - 0.5 * math.cos(t * math.tau))
    text_alpha = int(255 * fade)
    quote_fill = (244, 244, 246, text_alpha)
    for idx, line in enumerate(lines):
        centered_text(d, 103 + idx * 43, line, quote_font, quote_fill, glow_alpha=int(45 * fade))
    centered_text(d, 299, "— Unknown", attr_font, (165, 165, 174, text_alpha))
    centered_text(d, 358, "EXPLORE  ·  DREAM  ·  DISCOVER", tagline_font, (115, 115, 124, text_alpha))

    # GIF palette conversion keeps file size manageable.
    frames.append(canvas.convert("RGB").quantize(colors=128, method=Image.Quantize.MEDIANCUT))

frames[0].save(
    out, save_all=True, append_images=frames[1:],
    duration=100, loop=0, optimize=True, disposal=2
)
print(f"Created animated GIF: {out} ({out.stat().st_size:,} bytes)")
